name: Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code sample or steps that show the problem.
      render: csharp
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dagline version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, .NET version, and terminal (e.g. Windows Terminal, iTerm2, GNOME Terminal).
      placeholder: Windows 11, .NET 10.0.1, Windows Terminal
  - type: textarea
    id: logs
    attributes:
      label: Exception / output
      description: Stack traces or console output, if any.
      render: text

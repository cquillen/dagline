name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs tags and history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet build -c Release

      - run: dotnet test -c Release --no-build --coverage --coverage-output-format cobertura --report-trx --results-directory ${{ github.workspace }}/TestResults

      # Output redirected to a file, so the auto-choosing reporter must print plain text and the run must end complete.
      - name: Run the Basic sample with output redirected
        shell: bash
        run: |
          dotnet run --project samples/Dagline.Samples.Basic -c Release --no-build > basic-sample.txt
          cat basic-sample.txt
          grep -q 'run ended: complete' basic-sample.txt
          if grep -q $'\x1b' basic-sample.txt; then echo 'The Basic sample wrote control sequences to redirected output.' >&2; exit 1; fi

      # A clean run of the Batch sample at reference scale, in a fresh data directory, must end complete (exit code 0).
      - name: Run the Batch sample
        shell: bash
        run: |
          data_dir="$RUNNER_TEMP/batch-data"
          rm -rf "$data_dir"
          dotnet run --project samples/Dagline.Samples.Batch -c Release --no-build -- --fast --plain --dir "$data_dir"

      - name: Validate packages
        if: runner.os == 'Linux'
        run: dotnet pack -c Release --no-build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore

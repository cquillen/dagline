name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs tags and history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet build -c Release

      - run: dotnet test -c Release --no-build --coverage --coverage-output-format cobertura --report-trx --results-directory ${{ github.workspace }}/TestResults

      # Output redirected to a file, so the auto-choosing reporter must print plain text and the run must end complete.
      - name: Run the Basic sample with output redirected
        shell: bash
        run: |
          dotnet run --project samples/Dagline.Samples.Basic -c Release --no-build > basic-sample.txt
          cat basic-sample.txt
          grep -q 'run ended: complete' basic-sample.txt
          if grep -q $'\x1b' basic-sample.txt; then echo 'The Basic sample wrote control sequences to redirected output.' >&2; exit 1; fi

      # Three runs of the Batch sample on one journal, in a fresh data directory, checked by exit code only. The first
      # fails a validation, which blocks every job. The second continues it: one status call throws and one job ends in
      # error. The third continues again and can end complete only if the first job re-attaches and the last triggers
      # afresh, since the fake scheduler refuses a second trigger of a job that is running or done.
      - name: Run the Batch sample three times on one journal
        shell: bash
        run: |
          data_dir="$RUNNER_TEMP/batch-data"
          rm -rf "$data_dir"
          batch() {
            local expected=$1
            shift
            local code=0
            dotnet run --project samples/Dagline.Samples.Batch -c Release --no-build -- --fast --plain --dir "$data_dir" "$@" || code=$?
            if [ "$code" -ne "$expected" ]; then
              echo "The Batch sample run with '$*' exited $code, expected $expected." >&2
              exit 1
            fi
          }
          batch 1 --fault validate
          batch 1 --fault poll --fault job
          batch 0

      - name: Validate packages
        if: runner.os == 'Linux'
        run: dotnet pack -c Release --no-build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore
